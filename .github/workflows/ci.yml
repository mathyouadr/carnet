name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -t . -v

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web

  docker:
    runs-on: ubuntu-latest
    needs: [test, web]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -t carnet .
      - name: Smoke test
        run: |
          docker run -d --name carnet-smoke -p 8044:8044 carnet
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8044/healthz && break; sleep 1; done
          curl -fs -H "Content-Type: application/json" -d '{"title":"Smoke","markdown":"# Hello\n\n- [ ] world"}' \
            http://127.0.0.1:8044/api/pages | grep -q '"checkListItem"'
          curl -fs "http://127.0.0.1:8044/api/search?q=world" | grep -q Smoke
          curl -fs http://127.0.0.1:8044/ | grep -q '<div id="root">'
          curl -fs http://127.0.0.1:8044/ | grep -o 'assets/index-[A-Za-z0-9_-]*\.js' | head -1 | xargs -I{} curl -fsI http://127.0.0.1:8044/{}
      - name: Container logs
        if: always()
        run: docker logs carnet-smoke || true
      - name: Publish to GHCR (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker tag carnet $IMAGE:latest && docker push $IMAGE:latest
